name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK (preinstalled on GitHub runners)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project files
        run: |
          set -e
          mkdir -p /tmp/sp/app/src/main/java/com/stockpulse/bd /tmp/sp/app/src/main/res/values /tmp/sp/app/src/main/res/xml
          cd /tmp/sp
          cat > settings.gradle.kts <<'STOCKPULSE_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StockPulse"
          include(":app")
          STOCKPULSE_EOF
          cat > build.gradle.kts <<'STOCKPULSE_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          STOCKPULSE_EOF
          cat > gradle.properties <<'STOCKPULSE_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          STOCKPULSE_EOF
          cat > app/build.gradle.kts <<'STOCKPULSE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.stockpulse.bd"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.stockpulse.bd"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 644
                  versionName = "6.4.4"
                  // The web app that is shown inside the Android app.
                  buildConfigField("String", "APP_URL", "\"https://stockpulse.appbd.workers.dev/\"")
              }

              buildFeatures { buildConfig = true }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // Sign with your own keystore before publishing to Play Store (see README).
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          STOCKPULSE_EOF
          cat > app/src/main/AndroidManifest.xml <<'STOCKPULSE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:theme="@style/Theme.StockPulse">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="false">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="stockpulse.appbd.workers.dev" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          STOCKPULSE_EOF
          cat > app/src/main/res/values/strings.xml <<'STOCKPULSE_EOF'
          <resources>
              <string name="app_name">StockPulse</string>
          </resources>
          STOCKPULSE_EOF
          cat > app/src/main/res/values/themes.xml <<'STOCKPULSE_EOF'
          <resources>
              <style name="Theme.StockPulse" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:statusBarColor">#667eea</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          STOCKPULSE_EOF
          cat > app/src/main/res/xml/network_security_config.xml <<'STOCKPULSE_EOF'
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          STOCKPULSE_EOF
          cat > app/src/main/java/com/stockpulse/bd/MainActivity.kt <<'STOCKPULSE_EOF'
          package com.stockpulse.bd

          import android.annotation.SuppressLint
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.CookieManager
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.graphics.Color
          import android.view.Gravity
          import android.view.KeyEvent
          import android.webkit.ConsoleMessage
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var refresh: SwipeRefreshLayout
              private lateinit var banner: TextView
              private val logs = ArrayDeque<String>()
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private val appHost: String = Uri.parse(BuildConfig.APP_URL).host ?: ""

              // Hosts the web app itself needs (login, database, libraries). Everything else opens in the browser.
              private val allowedHosts = listOf(
                  appHost, "supabase.co", "firebaseapp.com", "googleapis.com",
                  "gstatic.com", "firebaseio.com", "jsdelivr.net", "vercel.app", "workers.dev"
              )

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  refresh = SwipeRefreshLayout(this)
                  webView = WebView(this)
                  refresh.addView(webView)
                  refresh.isEnabled = false   // pull-to-refresh off: it clashes with in-page scrolling and charts

                  // Small red bar that shows JavaScript errors (tap to hide). Helps to find problems inside the app.
                  banner = TextView(this).apply {
                      setBackgroundColor(Color.parseColor("#CCB71C1C"))
                      setTextColor(Color.WHITE)
                      textSize = 10f
                      maxLines = 18
                      setPadding(16, 12, 16, 12)
                      visibility = android.view.View.GONE
                      setOnClickListener { visibility = android.view.View.GONE; text = "" }
                  }
                  val root = FrameLayout(this)
                  root.addView(refresh, FrameLayout.LayoutParams(-1, -1))
                  root.addView(banner, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                  setContentView(root)
                  WebView.setWebContentsDebuggingEnabled(true)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true            // localStorage / IndexedDB (localForage, Firebase, Supabase)
                      cacheMode = WebSettings.LOAD_DEFAULT
                      allowFileAccess = false
                      allowContentAccess = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                      setSupportZoom(false)
                      builtInZoomControls = false
                      userAgentString = userAgentString + " StockPulseAndroid/" + BuildConfig.VERSION_NAME
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)

                  // Debug helper: runs before the page's own scripts. Makes console errors readable
                  // (objects -> text) and reports failed network requests, so they show in the red bar.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      val dbg = """(function(){
                        if(window.__spDbg)return;window.__spDbg=1;
                        // The PWA service worker breaks Supabase requests inside Android WebView -> switch it off in the app.
                        try{if(navigator.serviceWorker){
                          navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
                          navigator.serviceWorker.register=function(){return Promise.resolve({scope:'/',update:function(){return Promise.resolve();},unregister:function(){return Promise.resolve(true);},addEventListener:function(){}});};
                        }}catch(e){}
                        function s(x){try{if(x&&typeof x==='object'){var o={};Object.getOwnPropertyNames(x).forEach(function(k){o[k]=x[k]});return JSON.stringify(o).slice(0,260);}return String(x);}catch(e){return String(x);}}
                        var oe=console.error;console.error=function(){oe.call(console,[].slice.call(arguments).map(s).join(' '));};
                        var of=window.fetch;
                        if(of){window.fetch=function(i){var u=(typeof i==='string'?i:(i&&i.url))||'';
                          return of.apply(this,arguments).then(function(r){if(!r.ok)console.error('HTTP '+r.status+' '+u.slice(0,110));return r;},
                            function(e){console.error('FETCHFAIL '+u.slice(0,110)+' '+e);throw e;});};}
                      })();"""
                      WebViewCompat.addDocumentStartJavaScript(webView, dbg, setOf("*"))
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val uri = request.url
                          val host = uri.host
                          if ((uri.scheme == "http" || uri.scheme == "https") && host != null &&
                              allowedHosts.any { host == it || host.endsWith(".$it") }
                          ) return false
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, uri))   // mailto:, tel:, facebook, linkedin ...
                              true
                          } catch (e: Exception) { false }
                      }

                      override fun onPageFinished(view: WebView, url: String) { refresh.isRefreshing = false }

                      override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                          if (request.isForMainFrame) {
                              refresh.isRefreshing = false
                              view.loadDataWithBaseURL(null, offlineHtml(), "text/html", "utf-8", null)
                          }
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onConsoleMessage(m: ConsoleMessage): Boolean {
                          logs.addLast(m.messageLevel().name.take(1) + " " + m.message().take(110).replace("\n", " "))
                          if (logs.size > 14) logs.removeFirst()
                          if (m.messageLevel() == ConsoleMessage.MessageLevel.ERROR) {
                              val line = "• " + m.message().take(240) + "  (" + m.sourceId().substringAfterLast('/') + ":" + m.lineNumber() + ")"
                              val cur = banner.text.toString().lines().takeLast(6)
                              banner.text = (cur + line).filter { it.isNotBlank() }.joinToString("\n")
                              banner.visibility = android.view.View.VISIBLE
                          }
                          return true
                      }

                      // Needed for <input type="file"> (portfolio import etc.)
                      override fun onShowFileChooser(
                          webView: WebView, callback: ValueCallback<Array<Uri>>, params: FileChooserParams
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback
                          return try {
                              @Suppress("DEPRECATION")
                              startActivityForResult(params.createIntent(), FILE_CHOOSER)
                              true
                          } catch (e: Exception) { fileCallback = null; false }
                      }
                  }

                  webView.setDownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                      try {
                          val req = DownloadManager.Request(Uri.parse(url))
                              .setMimeType(mimeType)
                              .addRequestHeader("User-Agent", userAgent)
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(
                                  Environment.DIRECTORY_DOWNLOADS,
                                  URLUtil.guessFileName(url, contentDisposition, mimeType)
                              )
                          (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)
                          Toast.makeText(this, "Downloading…", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                      }
                  }

                  refresh.setColorSchemeColors(0xFF667EEA.toInt())

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })

                  if (savedInstanceState != null) webView.restoreState(savedInstanceState)
                  else webView.loadUrl(intent?.data?.toString() ?: BuildConfig.APP_URL)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == FILE_CHOOSER) {
                      fileCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCallback = null
                  } else {
                      @Suppress("DEPRECATION")
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onResume() { super.onResume(); webView.onResume() }
              override fun onPause() { webView.onPause(); CookieManager.getInstance().flush(); super.onPause() }


              // Press VOLUME UP while the app is open to see what the page looks like inside (debug helper).
              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_UP) { runDiag(); return true }
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      banner.text = "LOG (last " + logs.size + ")\n" + logs.joinToString("\n")
                      banner.visibility = android.view.View.VISIBLE
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }

              private fun runDiag() {
                  val js = """(function(){try{
                    var a=document.getElementById('app-container');
                    var mn=a&&a.querySelector('main');
                    function d(e){var c=getComputedStyle(e);return e.tagName+'#'+e.id+'.'+String(e.className).slice(0,25)+' '+c.display+'/'+c.position+' h='+e.offsetHeight+' w='+e.offsetWidth+' kids='+e.children.length;}
                    var mk=mn?Array.prototype.slice.call(mn.children,0,9).map(d):[];
                    var t=(document.body.innerText||'').replace(/\s+/g,' ');
                    return JSON.stringify({main:mn?d(mn):null,mainKids:mk,aside:d(a.querySelector('aside')),textLen:t.length,text:t.slice(0,160),
                      fb:typeof firebase,sb:typeof supabase,ls:localStorage.length,scripts:document.scripts.length,ua:navigator.userAgent.slice(0,90)});
                  }catch(e){return 'ERR '+e;}})()"""
                  webView.evaluateJavascript(js) { r ->
                      banner.text = "DIAG " + (r ?: "null").replace("\\\"", "'").take(900)
                      banner.visibility = android.view.View.VISIBLE
                  }
              }

              private fun offlineHtml() = """
                  <html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>
                  <body style="font-family:sans-serif;text-align:center;padding:48px 24px;color:#333">
                  <h2 style="color:#667eea">StockPulse</h2>
                  <p>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না।<br>No internet connection.</p>
                  <button style="padding:12px 28px;border:0;border-radius:10px;background:#667eea;color:#fff;font-size:16px"
                          onclick="location.href='${BuildConfig.APP_URL}'">আবার চেষ্টা করুন / Retry</button>
                  </body></html>
              """.trimIndent()

              companion object { private const val FILE_CHOOSER = 1001 }
          }
          STOCKPULSE_EOF
          # launcher icons from the app's own icon
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON=$(find "$GITHUB_WORKSPACE" -name icon-512x512.png | head -1)
          echo "Using icon: $ICON"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p app/src/main/res/mipmap-$n
            convert "$ICON" -resize ${s}x${s} app/src/main/res/mipmap-$n/ic_launcher.png
          done

      - name: Build debug APK
        working-directory: /tmp/sp
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: StockPulse-debug-apk
          path: /tmp/sp/app/build/outputs/apk/debug/*.apk
